# nparse CI.
#
# EVERY INPUT BUT THE RUNNER'S IMAGE IS PINNED, AND THE PIN IS ENFORCED RATHER THAN
# REQUESTED (cycle 0.0.1's plan; the compiler's D-204: the toolchain is a build input).
# The compiler is a COMMIT, never a branch: a library whose CI tracks another
# repository's `main` goes red for reasons that are not its own. Bumping a pin is a
# deliberate commit, and the commit that bumps it is the one that runs the full suite.
# Each action is pinned by the full commit sha that cycle 0.0.1's four runs each
# resolved its `@v4` to, the tag kept as a comment. The runner is a LABEL,
# `runs-on: ubuntu-24.04`, under which GitHub rolls the image: those four runs got
# 20261018.339.1 twice and then 20261012.334.1 twice, the second version the older,
# so the record quotes each run's image. Modelled on `nitpick-regex`'s workflow.
#
# WHAT A GREEN RUN PROVES SINCE CYCLE 0.0.2: the compiler's checkout is the pinned
# commit, clean; its emission, `npkc.ll`, is the one the pin recorded, built by a run
# with no cache and restored by one that hits it (the cache's step, below); LLVM is
# exactly 20.1.8; and `harness/run.py` printed its UNQUALIFIED green summary -- its
# three build steps and every suite `nitpick.toml` declares (`harness/README.md`).
# *(Cycle 0.0.1's line: the conformance consumer was built and run here by hand, and
# `harness/run.py` was a stub that judged nothing.)*
#
# EVERY HEX VALUE IS QUOTED. GitHub reads a workflow as YAML 1.2, where a bare run of
# digits, one `e` and digits is a NUMBER -- `7e91730` is infinity -- so a commit, a
# short commit and a digest are each a quoted string (`PLAYBOOK.md` §6).

name: nparse

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The workbench's pinned compiler, by FULL sha (`2e1cb4a` in the roadmap). PA-111.
  NITPICK_COMMIT: "2e1cb4adef795488c0530be297e441f923bbe090"
  # THE EMISSION AT THAT COMMIT, as the compiler's own build recorded it -- notice 140's
  # `npkc.ll` row. The emission step below ASSERTS it: the compiler's D-265 says the
  # emission, not the binary, is the cross-machine claim. Moved with every pin.
  NPKC_LL_SHA256: "0073060250f0e56329ab77a01de45b0f499c0441db66215b7b762c9fe911b27c"
  NPKC_LL_BYTES: "32569732"
  # nitpick.toml's [toolchain] llvm: an exact patch release. Upstream publishes
  # `LLVM-20.1.8-Linux-X64.tar.xz` at its `llvmorg-20.1.8` release.
  LLVM_VERSION: "20.1.8"
  # THAT ASSET BY CONTENT (cycle 0.0.1a): its sha256 as the plan measured it, streamed
  # whole, and as GitHub's record of the asset and the LLVM project's provenance for it
  # give it (`meta/research/llvm-release-asset.md`). The install step holds the
  # download to it before `tar` reads a byte.
  LLVM_TARBALL_SHA256: "1ead36b3dfcb774b57be530df42bec70ab2d239fbce9889447c7a29a4ddc1ae6"

jobs:
  build:
    # A release's label, not `ubuntu-latest` -- but GitHub still rolls the image under it,
    # the one input not pinned (the header).
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out nparse
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4

      - name: Check out the pinned compiler
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4
        with:
          repository: alternative-intelligence-cp/nitpick
          ref: ${{ env.NITPICK_COMMIT }}
          path: .nitpick

      # `actions/checkout` with an explicit `ref` should make this redundant. It is the
      # one fact every claim below rests on, so it is measured, not promised.
      - name: Assert the compiler is AT the pinned commit
        run: |
          set -euo pipefail
          have="$(git -C .nitpick rev-parse HEAD)"
          if [ "$have" != "$NITPICK_COMMIT" ]; then
            echo "compiler checkout is at $have; the pin is $NITPICK_COMMIT" >&2
            exit 1
          fi
          if [ -n "$(git -C .nitpick status --porcelain)" ]; then
            echo "the compiler checkout is dirty; the pin names a commit" >&2
            exit 1
          fi
          echo "compiler HEAD == $have (clean)"

      # The upstream release tarball: apt.llvm.org packages by MAJOR version and would
      # give whatever 20.1.x is current. WHAT THE CHECK GUARANTEES (cycle 0.0.1a): the
      # install step downloads the tarball to a file and holds it to LLVM_TARBALL_SHA256
      # with `sha256sum -c` before `tar` reads it, so a tree unpacked on a cache miss is
      # the asset that digest names; and the key names the digest, so a hit restores a
      # tree saved under it, which this job saves only when it succeeds, its check
      # passed. It says nothing of who built the asset: that the digest is the LLVM
      # project's own is the plan's measurement. *(Until cycle 0.0.1a this said "Cached
      # on the version, an immutable asset", which nothing measured: the release is not
      # immutable in GitHub's sense, and the tarball was piped into `tar` unchecked.)*
      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        id: llvm-cache
        uses: "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830" # v4
        with:
          path: ~/llvm
          key: llvm-${{ env.LLVM_VERSION }}-linux-x64-${{ env.LLVM_TARBALL_SHA256 }}

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/llvm
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          tarball="$RUNNER_TEMP/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          curl -fsSL -o "$tarball" "$url"
          echo "downloaded $(stat -c '%s' "$tarball") B: $url"
          echo "$LLVM_TARBALL_SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball" --strip-components=1 -C ~/llvm
          rm -f "$tarball"

      - name: Put LLVM on PATH and assert the pin
        run: |
          set -euo pipefail
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/llvm/bin:$PATH"
          for t in llc opt ld.lld; do
            have="$("$t" --version | sed -nE 's/.*(LLVM version|LLD) ([0-9.]+).*/\2/p' | sed -n 1p)"
            if [ "$have" != "$LLVM_VERSION" ]; then
              echo "$t is $have; nitpick.toml pins $LLVM_VERSION exactly." >&2
              exit 1
            fi
            echo "$t --version == $have"
          done

      # Keyed on the compiler's commit and the LLVM release. A hit rebuilds nothing, and of
      # the restored build the emission step asserts only `npkc.ll`'s digest and size:
      # `npkc` and `npkrt.o` are printed, not asserted. The fresh-build proof is each pin's
      # first, uncached run: `c9baa9e`'s on cycle 0.0.1's step 4, `2e1cb4a`'s on cycle
      # 0.0.1a's step 1. The compiler's bootstrap harness, `quickemit.py`, leaves the two
      # artefacts this library needs -- `npkc` and `npkrt.o` -- in `.internal/quickemit/`.
      - name: Cache the built compiler
        id: npkc-cache
        uses: "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830" # v4
        with:
          path: .nitpick/.internal/quickemit
          key: npkc-${{ env.NITPICK_COMMIT }}-llvm-${{ env.LLVM_VERSION }}

      - name: Build the compiler from the pinned commit
        if: steps.npkc-cache.outputs.cache-hit != 'true'
        working-directory: .nitpick
        run: |
          set -euo pipefail
          python3 bootstrap/harness/quickemit.py --keep npkg/main.npk

      - name: Check the toolchain artefacts exist
        run: |
          set -euo pipefail
          test -f .nitpick/.internal/quickemit/npkc
          test -f .nitpick/.internal/quickemit/npkrt.o
          echo "NPKC=$GITHUB_WORKSPACE/.nitpick/.internal/quickemit/npkc"   >> "$GITHUB_ENV"
          echo "NPKRT=$GITHUB_WORKSPACE/.nitpick/.internal/quickemit/npkrt.o" >> "$GITHUB_ENV"

      # THE EMISSION, PRINTED AND ASSERTED. Every artefact the ladder leaves is printed with
      # its size and digest, so the first that differs names the stage; the emission alone is
      # asserted, because a binary's bytes may differ by machine and the emission may not.
      - name: The compiler's emission, asserted against the pin's row
        working-directory: .nitpick/.internal/quickemit
        run: |
          set -euo pipefail
          echo "compiler pin: $NITPICK_COMMIT"
          for f in builder.o builder npkrt.o npkc.ll npkc.o npkc; do
            if [ -f "$f" ]; then
              printf '%-12s %10s bytes  %s\n' "$f" "$(stat -c '%s' "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            else
              printf '%-12s %s\n' "$f" "absent"
            fi
          done
          have="$(sha256sum npkc.ll | cut -d' ' -f1)"
          size="$(stat -c '%s' npkc.ll)"
          if [ "$have" != "$NPKC_LL_SHA256" ] || [ "$size" != "$NPKC_LL_BYTES" ]; then
            echo "npkc.ll is $size B / $have; the pin's emission is $NPKC_LL_BYTES B / $NPKC_LL_SHA256." >&2
            echo "The emission is the cross-machine claim (the compiler's D-265): a compiler defect to raise." >&2
            exit 1
          fi
          echo "npkc.ll == the pin's emission, $size B / $have"

      # THE HARNESS, AND ITS SUMMARY ASSERTED, NOT ONLY ITS STATUS (`nitpick-regex`'s CI is
      # the model). The runner prints its verdict LAST, `harness: GREEN -- ...` when nothing
      # failed; this step requires that line as the log's last, so an exit 0 that does not
      # end in it -- a runner that stopped short -- is red here. The interpreter's version is
      # printed first: `meta/research/CURRENCY.md` holds a row for it.
      - name: Run the harness
        run: |
          set +e
          set -uo pipefail
          python3 --version
          log="$RUNNER_TEMP/harness.log"
          python3 -B harness/run.py > "$log" 2>&1
          status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          last="$(tail -n 1 "$log")"
          case "$last" in
            "harness: GREEN -- "*) echo "the harness's summary is the unqualified green one" ;;
            *) echo "the harness exited 0 without its unqualified green summary last: $last" >&2; exit 1 ;;
          esac
