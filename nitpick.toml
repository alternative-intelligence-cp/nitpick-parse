# nparse — the manifest.
#
# The schema is the compiler's (BUILD_REFERENCE.md §1, D-077): six tables and
# the `[[test]]` array. This manifest carries four of the tables -- `[verify]`
# configures the compiler's verified build and `[limits]` the compiler's own
# runners, and no tool of this library runs either. It is written in full
# ahead of the tool that reads it, because a manifest that appears when the
# tooling arrives is a manifest nobody reviewed.
# *(Corrected 2026-10-21, cycle 0.0.1 -- PA-111: this said "four tables plus the
# `[[test]]` array", and the compiler's schema has six.)*
#
# WHAT CANNOT READ THIS YET. `npkg build` is the compiler's own bootstrap
# ladder — it assembles `runtime/npkrt.ll` and `bootstrap/seed/stage1.ll`, has
# the builder compile `[build] entry`, and names the result `npkc`. There is no
# generic-project path, and `[dependencies]` is parsed but the resolver's root
# list is initialised empty and never populated, so a `use "nparse/…"` path
# resolves against nothing. Until that changes, `harness/` builds this library
# by invoking `npkc`, `llc` and `ld.lld` directly — the same relationship
# `bootstrap/harness/` has to `npkg` in the compiler repo, and it retires the
# same way. See meta/specs/BUILD.md.

[project]
name        = "nparse"
version     = "0.0.0"
description = "Multi-format parsing for Nitpick — one event stream, one document model, one set of scanning primitives"
authors     = ["Randy"]
target      = "library"

[build]
entry     = "src/lib.npk"
output    = "build/libnparse"
# 0 while the library is being built out, matching the compiler's own choice:
# `opt` is not invoked at all, the pipeline stays short, and the emitted IR
# stays readable. The harness re-runs every program through `opt -O2` as a
# CHECK regardless (the 1.3.8 instrument), which is where optimiser divergence
# gets caught — raising this key is a separate decision from running that leg.
opt-level = 0

# THE TOOLCHAIN IS A BUILD INPUT (D-204), pinned to the exact patch release the
# compiler pins, because a patch release may change instruction selection. These
# lists are READ by every `llc`/`opt`/`ld.lld` invocation the harness makes; a
# stated flag nothing consumes is the next stale document.
# *(20.1.8 since cycle 0.0.1, 2026-10-21 -- PA-111: the compiler's D-349 moved its pin from
# 20.1.2 at its landing 99, and compiler `7e91730` carries it.)*
[toolchain]
llvm          = "20.1.8"
# THE TARGET EVERY MODULE STATES (the compiler's E-8, D-322 (5), its landing 71).
# Every emission opens with a `target datalayout` and a `target triple` line, and
# these two rows are what the runner holds them to: `datalayout` to what the
# pinned `opt` derives from `triple`, and every linked program's two lines to
# both (cycle 0.0.2's harness). Pins, not settings -- the compiler's runners
# refuse a manifest without either, by name (its BUILD_REFERENCE.md §1) -- and
# the layout is the FULL string: `llvm-as` completes a partial one, which then
# fails the belt.
triple        = "x86_64-unknown-linux-gnu"
datalayout    = "e-m:e-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:128-n8:16:32:64-S128"
llc-flags     = ["-O0", "-filetype=obj", "-relocation-model=static"]
llc-opt-flags = ["-O2", "-filetype=obj", "-relocation-model=static"]
opt-flags     = ["-O2", "-S"]
lld-flags     = ["-static"]

# EMPTY, AND EMPTY ON PURPOSE. `nparse` depends on the language and its prelude
# and on nothing else — not on the compiler's `src/`, not on `lib/`, not on
# `nregex` (a parser that needed a regex engine would be a parser that had
# stopped being a parser), and not on `ntime` (the datetime overlap is recorded
# as O-P4, not resolved by a dependency that cannot resolve). Anything added
# here is a zero-dependency decision and has to be argued as one
# (meta/specs/BUILD.md §4).
[dependencies]

# TEST TARGETS. Each cycle adds its own entries as its suite is created; an
# entry naming a directory with nothing in it is a suite that reports green
# while checking nothing, which is the failure this table exists to prevent.
# The stages are the compiler's (BUILD_REFERENCE §7.1) plus this library's own
# `roundtrip` and `corpus`, and the expectation grammar lives inside each test
# file. Suites run in the order written here.

# Cycle 0.0.1's two entries. `compile`/`positive` means "compiles, links, runs,
# and exits with the expected code": the consumer of the public surface.
[[test]]
name  = "conformance"
stage = "compile"
kind  = "positive"
path  = "tests/conformance"

# Cycle 0.0.0's probes that compile, link and run, judged by their exit codes at
# -O0 and again through `opt -O2`. `path` is a directory, not recursive, so the
# probes refused on purpose (`tests/probe/refused/`) are not in it -- they have
# their own entry, judged their own way, from cycle 0.0.3 -- and nor would a
# compiler defect's reproduction be (`tests/probe/defect/`, none at the pin).
[[test]]
name  = "probe"
stage = "program"
path  = "tests/probe"

# Cycle 0.0.3's refusals (PA-115): the probes refused on purpose, each judged
# by `npkc` alone against exactly the codes and sites it names (`BUILD.md` B-7),
# probe 08h among them -- the reseat a callee makes, refused from the compiler's
# landing 116 (DEF-252).
[[test]]
name  = "refused"
stage = "check"
path  = "tests/probe/refused"

# The parse sweep (cycle 0.0.3, PA-115): every `.npk` in the tree compiled as
# a root, none with a LEX- or PARSE- code. It comes last, so a file a suite
# judges is judged there first, by its own rule. The runner refuses a manifest
# without it: a run that swept nothing would be green over files nothing compiled.
[[test]]
name      = "sweep"
stage     = "parse"
path      = "."
recursive = true
